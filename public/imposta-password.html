<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Imposta password — Studio Mazzini</title>
  <style>
    :root { --ink:#1a2332; --accent:#1f4e79; --bg:#f4f6f9; --err:#b00020; --ok:#1e7e34; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
           background: var(--bg); color: var(--ink); display:flex; min-height:100vh;
           align-items:center; justify-content:center; padding:20px; }
    .card { background:#fff; width:100%; max-width:420px; border-radius:14px;
            box-shadow:0 10px 40px rgba(0,0,0,.08); padding:32px; }
    h1 { font-size:20px; margin:0 0 4px; }
    p.sub { color:#5b6672; font-size:14px; margin:0 0 24px; }
    label { display:block; font-size:13px; font-weight:600; margin:14px 0 6px; }
    input { width:100%; padding:12px 14px; border:1px solid #d4dae2; border-radius:9px; font-size:15px; }
    input:focus { outline:none; border-color:var(--accent); }
    button { width:100%; margin-top:22px; padding:13px; border:0; border-radius:9px;
             background:var(--accent); color:#fff; font-size:15px; font-weight:600; cursor:pointer; }
    button:disabled { opacity:.5; cursor:default; }
    .msg { margin-top:16px; font-size:14px; }
    .msg.err { color:var(--err); }
    .msg.ok  { color:var(--ok); }
    .hint { font-size:12px; color:#8a95a1; margin-top:6px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Imposta la tua password</h1>
    <p class="sub">Portale condomini — Studio Mazzini</p>

    <div id="form-area">
      <label for="pw1">Nuova password</label>
      <input id="pw1" type="password" autocomplete="new-password" />
      <div class="hint">Almeno 8 caratteri.</div>

      <label for="pw2">Ripeti password</label>
      <input id="pw2" type="password" autocomplete="new-password" />

      <button id="btn" disabled>Imposta password e accedi</button>
      <div id="msg" class="msg"></div>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const SUPABASE_URL = 'https://ybjivemwjiqqykzmyhoe.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_F9JOO3hOeLKwbhlB1uRMwQ_9GTh78hA';
    const PORTALE_URL = '/';   // dove mandare l'utente dopo aver impostato la password

    const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { detectSessionInUrl: true, flowType: 'implicit', persistSession: true },
    });

    const btn = document.getElementById('btn');
    const pw1 = document.getElementById('pw1');
    const pw2 = document.getElementById('pw2');
    const msg = document.getElementById('msg');
    function setMsg(text, kind) { msg.textContent = text; msg.className = 'msg ' + (kind || ''); }

    let sessioneOk = false;
    const { data } = await sb.auth.getSession();
    if (data && data.session) {
      sessioneOk = true;
    } else {
      sb.auth.onAuthStateChange((_e, session) => { if (session) { sessioneOk = true; validate(); } });
    }
    if (!sessioneOk && !location.hash.includes('access_token')) {
      setMsg('Link non valido o scaduto. Chiedi un nuovo invito allo Studio.', 'err');
    }

    function validate() {
      const ok = sessioneOk && pw1.value.length >= 8 && pw1.value === pw2.value;
      btn.disabled = !ok;
      if (pw1.value && pw2.value && pw1.value !== pw2.value) setMsg('Le due password non coincidono.', 'err');
      else if (msg.className.includes('err') && sessioneOk) setMsg('', '');
    }
    pw1.addEventListener('input', validate);
    pw2.addEventListener('input', validate);

    btn.addEventListener('click', async () => {
      btn.disabled = true;
      setMsg('Salvataggio…', '');
      const { error } = await sb.auth.updateUser({ password: pw1.value });
      if (error) { setMsg('Errore: ' + error.message, 'err'); btn.disabled = false; return; }
      setMsg('Password impostata. Accesso in corso…', 'ok');
      setTimeout(() => { location.href = PORTALE_URL; }, 1200);
    });
  </script>
</body>
</html>
