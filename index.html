<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>portale-mazzini</title>
      <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#1e40af">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Portale Mazzini">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
      <script>
      // Registrazione service worker
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/sw.js").catch(function(){});
        });
      }
      // Avviso "Aggiungi a Home" solo su iPhone/iPad (Safari, non gia installato)
      (function () {
        try {
          var ua = navigator.userAgent || "";
          var isIOS = /iphone|ipad|ipod/i.test(ua);
          var standalone = window.navigator.standalone === true;
          if (!isIOS || standalone) return;
          if (localStorage.getItem("pwa_hint_dismissed") === "1") return;
          window.addEventListener("load", function () {
            var bar = document.createElement("div");
            bar.style.cssText = "position:fixed;left:12px;right:12px;bottom:12px;z-index:99999;background:#1e40af;color:#fff;border-radius:16px;padding:14px 16px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-family:system-ui,-apple-system,sans-serif;display:flex;align-items:center;gap:12px";
            bar.innerHTML = '<div style="font-size:22px">\uD83D\uDCF2</div><div style="flex:1;font-size:13px;line-height:1.35">Installa il Portale sul telefono: tocca <strong>Condividi</strong> e poi <strong>\u201CAggiungi a Home\u201D</strong>.</div>';
            var close = document.createElement("button");
            close.textContent = "\u2715";
            close.setAttribute("aria-label","Chiudi");
            close.style.cssText = "background:transparent;border:0;color:#fff;font-size:18px;padding:4px 6px;cursor:pointer";
            close.onclick = function () { try { localStorage.setItem("pwa_hint_dismissed","1"); } catch(e){} bar.remove(); };
            bar.appendChild(close);
            document.body.appendChild(bar);
          });
        } catch (e) {}
      })();
    </script>
  </body>
</html>
